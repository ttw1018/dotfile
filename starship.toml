format = """
[  ](fg:#e3e5e5 bg:#769ff0)\
$directory\
$conda\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$php\
[](fg:#769ff0) \
"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[conda]
format = '[$symbol$environment](fg:#e3e5e5 bg:#769ff0) '

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[$symbol $branch](fg:#e3e5e5 bg:#769ff0)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status $ahead_behind)](fg:#e3e5e5 bg:#769ff0)]($style)'

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
